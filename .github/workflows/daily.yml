name: daily

on:
  schedule:
    - cron: '0 9 * * *'  # 17:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data_store

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Daily update
        working-directory: pipeline
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python -m wp daily --data-dir "${{ github.workspace }}/data_store"

      - name: Commit data
        run: |
          cd data_store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: daily update $(date -u +%F)"
            git push origin HEAD:data
          fi

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
